<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lichtenstein / Warhol Pop Art badge: 35mm reel + lightning shattering flat streaming play triangle -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#E80000" stroke="#000000" stroke-width="4"/>
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#0B0D14" stroke="#FFE600" stroke-width="2.5"/>
  <!-- Cracked streaming play triangle being slashed -->
  <path d="M22 19L45 32L22 45V19Z" fill="#2A314A" stroke="#00E5FF" stroke-width="2"/>
  <!-- Bold Pop Art lightning / cult cinema slash across the generic play button -->
  <path d="M40 12L23 33H33L24 52L45 29H34L40 12Z" fill="#FFE600" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Film sprocket dots -->
  <circle cx="14" cy="18" r="2.2" fill="#FF1E8A"/>
  <circle cx="14" cy="32" r="2.2" fill="#00E5FF"/>
  <circle cx="14" cy="46" r="2.2" fill="#FF1E8A"/>
</svg>
